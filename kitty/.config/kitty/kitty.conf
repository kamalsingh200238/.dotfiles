# Font
font_family      JetBrains Mono Bold
font_size        16.0

# Nerd font and emoji fallbacks
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b5,U+e700-U+e7c5,U+ed00-U+efc1,U+f000-U+f2ff,U+f300-U+f372,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font
symbol_map U+1f600-U+1f64f,U+1f300-U+1f5ff,U+1f680-U+1f6ff,U+1f900-U+1f9ff,U+1fa00-U+1fa6f,U+1fa70-U+1faff,U+2600-U+26ff,U+2700-U+27bf JoyPixels

# Catppuccin Mocha colors
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc
cursor                  #cdd6f4
cursor_text_color       #1e1e2e
url_color               #f5e0dc

# Black
color0  #45475a
color8  #585b70
# Red
color1  #f38ba8
color9  #f38ba8
# Green
color2  #a6e3a1
color10 #a6e3a1
# Yellow
color3  #f9e2af
color11 #f9e2af
# Blue
color4  #89b4fa
color12 #89b4fa
# Magenta
color5  #f5c2e7
color13 #f5c2e7
# Cyan
color6  #94e2d5
color14 #94e2d5
# White
color7  #bac2de
color15 #a6adc8

# Mark colors
mark1_foreground #1e1e2e
mark1_background #b4befe
mark2_foreground #1e1e2e
mark2_background #cba6f7
mark3_foreground #1e1e2e
mark3_background #74c7ec

# Window
window_padding_width 0
background_opacity   1.0
confirm_os_window_close 0

# macOS
macos_option_as_alt yes
macos_quit_when_last_window_closed yes
