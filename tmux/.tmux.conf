# Modal keybindings matching zellij with sticky modes
# Ctrl+Space -> prefix mode -> t/p/r/s/m/o for tab/pane/resize/scroll/move/session

# Prefix: Ctrl+Space
unbind C-b
set -g prefix C-Space
unbind -T prefix -a
bind C-Space send-prefix

# Prefix mode bindings
bind t switch-client -T tab
bind p switch-client -T pane
bind r switch-client -T resize
bind s copy-mode
bind m switch-client -T move
bind o switch-client -T session
bind q confirm-before -p "Kill tmux? (y/n)" kill-server
bind R source-file ~/.tmux.conf \; display-message "Config reloaded"
bind Escape send-keys ""

# Direct tab access from prefix
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# Tab mode - STICKY
bind -T tab h { previous-window; switch-client -T tab }
bind -T tab j { next-window; switch-client -T tab }
bind -T tab k { previous-window; switch-client -T tab }
bind -T tab l { next-window; switch-client -T tab }
bind -T tab 1 select-window -t 1
bind -T tab 2 select-window -t 2
bind -T tab 3 select-window -t 3
bind -T tab 4 select-window -t 4
bind -T tab 5 select-window -t 5
bind -T tab 6 select-window -t 6
bind -T tab 7 select-window -t 7
bind -T tab 8 select-window -t 8
bind -T tab 9 select-window -t 9
bind -T tab n new-window -c "#{pane_current_path}"
bind -T tab x confirm-before -p "Close window? (y/n)" kill-window
bind -T tab r command-prompt -I "#W" "rename-window '%%'"
bind -T tab H { swap-window -t -1; previous-window; switch-client -T tab }
bind -T tab L { swap-window -t +1; next-window; switch-client -T tab }
bind -T tab Tab last-window
bind -T tab Escape send-keys ""
bind -T tab Enter send-keys ""

# Pane mode - STICKY
bind -T pane h { select-pane -L; switch-client -T pane }
bind -T pane j { select-pane -D; switch-client -T pane }
bind -T pane k { select-pane -U; switch-client -T pane }
bind -T pane l { select-pane -R; switch-client -T pane }
bind -T pane d split-window -v -c "#{pane_current_path}"
bind -T pane r split-window -h -c "#{pane_current_path}"
bind -T pane x kill-pane
bind -T pane f resize-pane -Z
bind -T pane p { select-pane -t :.+; switch-client -T pane }
bind -T pane Escape send-keys ""
bind -T pane Enter send-keys ""

# Resize mode - STICKY
bind -T resize h { resize-pane -L 5; switch-client -T resize }
bind -T resize j { resize-pane -D 5; switch-client -T resize }
bind -T resize k { resize-pane -U 5; switch-client -T resize }
bind -T resize l { resize-pane -R 5; switch-client -T resize }
bind -T resize H { resize-pane -L 1; switch-client -T resize }
bind -T resize J { resize-pane -D 1; switch-client -T resize }
bind -T resize K { resize-pane -U 1; switch-client -T resize }
bind -T resize L { resize-pane -R 1; switch-client -T resize }
bind -T resize Escape send-keys ""
bind -T resize Enter send-keys ""

# Move mode - STICKY
bind -T move h { swap-pane -U; switch-client -T move }
bind -T move j { swap-pane -D; switch-client -T move }
bind -T move k { swap-pane -U; switch-client -T move }
bind -T move l { swap-pane -D; switch-client -T move }
bind -T move Escape send-keys ""
bind -T move Enter send-keys ""

# Session mode
bind -T session w choose-tree -Zs
bind -T session d detach-client
bind -T session Escape send-keys ""
bind -T session Enter send-keys ""

# Copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# General settings
set -g mouse on
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features ',xterm-256color:extkeys'
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Status bar
set -g status-position bottom
set -g status-interval 1
set -g status-left-length 50
set -g status-right-length 150

# Catppuccin mocha colors (only what we use)
%hidden C_MAUVE="#cba6f7"
%hidden C_PEACH="#fab387"
%hidden C_YELLOW="#f9e2af"
%hidden C_GREEN="#a6e3a1"
%hidden C_TEAL="#94e2d5"
%hidden C_BLUE="#89b4fa"
%hidden C_LAVENDER="#b4befe"
%hidden C_PINK="#f5c2e7"
%hidden C_TEXT="#cdd6f4"
%hidden C_SUBTEXT0="#a6adc8"
%hidden C_OVERLAY0="#6c7086"
%hidden C_SURFACE0="#313244"
%hidden C_SURFACE1="#45475a"
%hidden C_BASE="#1e1e2e"
%hidden C_MANTLE="#181825"

# Status styling
set -g status-style "bg=#{C_MANTLE},fg=#{C_TEXT}"
set -g window-status-format "#[fg=#{C_OVERLAY0}] #I:#W "
set -g window-status-current-format "#[fg=#{C_MANTLE},bg=#{C_MAUVE},bold] #I:#W #[default]"
set -g window-status-separator ""
set -g status-left "#[fg=#{C_BASE},bg=#{C_MAUVE},bold] #S #[default]"
set -g status-right "\
#{?#{==:#{client_key_table},prefix},#[fg=#{C_BASE}#,bg=#{C_GREEN}#,bold] NORMAL #[fg=#{C_SUBTEXT0}#,bg=#{C_SURFACE0}] t:tab p:pane r:resize s:scroll m:move o:session ,\
#{?#{==:#{client_key_table},tab},#[fg=#{C_BASE}#,bg=#{C_BLUE}#,bold] TAB #[fg=#{C_SUBTEXT0}#,bg=#{C_SURFACE0}] hjkl:nav 1-9:go n:new x:close r:rename ,\
#{?#{==:#{client_key_table},pane},#[fg=#{C_BASE}#,bg=#{C_PEACH}#,bold] PANE #[fg=#{C_SUBTEXT0}#,bg=#{C_SURFACE0}] hjkl:nav d:down r:right x:close f:full ,\
#{?#{==:#{client_key_table},resize},#[fg=#{C_BASE}#,bg=#{C_YELLOW}#,bold] RESIZE #[fg=#{C_SUBTEXT0}#,bg=#{C_SURFACE0}] hjkl:grow HJKL:shrink ,\
#{?#{==:#{client_key_table},move},#[fg=#{C_BASE}#,bg=#{C_PINK}#,bold] MOVE #[fg=#{C_SUBTEXT0}#,bg=#{C_SURFACE0}] hjkl:swap ,\
#{?#{==:#{client_key_table},session},#[fg=#{C_BASE}#,bg=#{C_TEAL}#,bold] SESSION #[fg=#{C_SUBTEXT0}#,bg=#{C_SURFACE0}] w:picker d:detach ,\
#[fg=#{C_BASE}#,bg=#{C_LAVENDER}#,bold] LOCKED #[fg=#{C_SUBTEXT0}#,bg=#{C_SURFACE0}] ^Spc:unlock \
}}}}}}#[fg=#{C_BASE},bg=#{C_MAUVE},bold] %H:%M:%S "

# Pane borders
set -g pane-border-style "fg=#{C_SURFACE1}"
set -g pane-active-border-style "fg=#{C_MAUVE}"

# Message and copy mode styling
set -g message-style "fg=#{C_TEXT},bg=#{C_SURFACE0}"
set -g message-command-style "fg=#{C_TEXT},bg=#{C_SURFACE0}"
set -g mode-style "fg=#{C_BASE},bg=#{C_MAUVE}"
